# Config estático do livekit-server, montado read-only no container pela
# stack gerenciada pelo Coolify (ver docker-compose.yml). Domínio
# hardcoded como livekit.usesenju.com — este arquivo não interpola
# variáveis de ambiente, então qualquer troca de domínio exige editar
# aqui também (mesma ressalva vale pro par de chaves em `keys`, abaixo).

port: 7880

rtc:
  # Mux de porta única em vez de rtc.port_range_start/port_range_end
  # (o range de 50000-60000 do deploy "cloud VM padrão" da doc oficial).
  # Necessário porque este container roda na rede bridge que o Coolify
  # cria pra cada stack (não network_mode: host) — o Traefik do Coolify
  # só enxerga containers nessa rede, e host networking tiraria o
  # container dela, quebrando o roteamento de domínio por completo.
  # Publicar um range de 10 mil portas UDP individualmente no Docker
  # geraria ~10 mil regras DNAT; um mux de porta única evita isso.
  # Oficialmente suportado (config-sample.yaml: "port_range_start & end
  # must not be set for this config to take effect"). Se a CPU virar
  # gargalo no futuro, considerar um range pequeno tipo 7882-7883 (uma
  # porta por vCPU) — nunca o range de 10 mil. Ver 01-RESEARCH.md §3.
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: livekit.usesenju.com
  tls_port: 5349
  udp_port: 3478
  # Certificado PRÓPRIO do TURN, obtido via DNS-01 (certbot-dns-multi +
  # Hostinger, ver turn-cert-init.sh) — independente do certificado que
  # o Traefik/Coolify gerencia pra porta 443. NUNCA extrair do acme.json
  # do Coolify: é regenerado a cada renovação e o formato interno não é
  # um contrato estável. Ver 01-RESEARCH.md §5.
  cert_file: /etc/letsencrypt/live/livekit.usesenju.com/fullchain.pem
  key_file: /etc/letsencrypt/live/livekit.usesenju.com/privkey.pem
  # relay_range_start/relay_range_end (default 1024-30000) fica com o
  # valor padrão de propósito: é comunicação interna entre o processo
  # TURN embutido e o SFU, dentro do mesmo container — não precisa
  # constar em firewall nem em `ports:` do compose (confirmado: não
  # aparece na tabela oficial de portas expostas). Ver 01-RESEARCH.md §4.

# NÃO existe bloco `keys:` aqui, e isso é intencional.
#
# As chaves chegam pela variável de ambiente LIVEKIT_KEYS, no formato
# "chave: segredo", definida nas env vars da stack no Coolify.
#
# Por que não no arquivo: este YAML é montado estático a partir do
# checkout que o Coolify faz do repositório. Qualquer edição manual aqui
# seria revertida silenciosamente no próximo redeploy — a autenticação
# quebraria sem erro visível, e só apareceria como "ninguém consegue
# entrar em call". Env var do Coolify sobrevive a redeploy; arquivo
# editado à mão no checkout, não.
#
# Gerar os valores com `openssl rand -hex 32` (duas vezes).

logging:
  level: info

# Plano 07-02 (VOICE-04, Pitfall 3): reconciliação de usuário-fantasma. A rota
# `convex/http.ts` (POST /livekit/webhook) já existe e está testada — falta só
# apontar o LiveKit pra ela e fazer o redeploy da stack no Coolify (Plano 07-08).
#
# api_key: mesma LIVEKIT_API_KEY já usada em `keys`/LIVEKIT_KEYS (ver passo 6 e 9.1
# do DEPLOY-RUNBOOK.md) — o LiveKit assina o payload do webhook com o par
# (api_key, api_secret) correspondente, e `verifyLiveKitWebhook`
# (convex/voiceToken.ts) confere contra o mesmo par lido de LIVEKIT_API_KEY/
# LIVEKIT_API_SECRET nas env vars do Convex. Precisam ser IDENTICOS.
#
# urls: aponta para o deployment do Convex. É endereço público, não credencial.
#
# api_key: PRECISA ser preenchido com o valor real e COMMITADO. Parece contrariar
# a decisão de tirar as chaves deste arquivo, mas é diferente:
#
#   - O que saiu daqui foi o par `keys: chave: segredo`, porque o SEGREDO assina
#     tokens de sala. Ele vive em LIVEKIT_KEYS, env var do Coolify.
#   - `webhook.api_key` é só a metade pública, o identificador de qual par usar.
#     Sozinho não assina nada.
#   - E precisa estar no arquivo versionado porque edição manual no checkout do
#     Coolify é revertida no próximo redeploy, em silêncio — a armadilha que o
#     passo 8 do runbook existia para descrever e que eliminamos.
#
# Se um dia isso incomodar, a saída é mover a config inteira para a env var
# LIVEKIT_CONFIG no Coolify — ao custo de o arquivo sair do Git e perder revisão.
