<!doctype html>
<!--
  class="dark": tema escuro é fixo por decisão de produto; não existe toggle.
  O bloco `.dark` de src/renderer/src/assets/main.css é ativado por SELETOR DE
  CLASSE (`@custom-variant dark (&:is(.dark *))`), não por `prefers-color-scheme`:
  sem esta classe, `:root` (tema claro) vence e toda a UI renderiza em branco.
  Fica no HTML e não em JS porque `classList.add('dark')` no boot só acrescentaria
  um flash de tema claro e mais um lugar para esquecer.
-->
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>janja</title>
    <!-- theme-color: equivalente sRGB de --background do bloco .dark (oklch(0.145 0 0)) -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https://*.convex.cloud; connect-src 'self' ws: wss: https://*.convex.cloud wss://*.convex.cloud https://*.convex.site wss://livekit.usesenju.com https://livekit.usesenju.com"
    />
    <!--
      A CSP padrão do template do electron-vite é `default-src 'self'`, que
      bloqueia toda conexão externa. Sem ajustar, o WebSocket do Convex é
      recusado pelo navegador e o app trava numa tela "Carregando…" eterna —
      sem erro de aplicação, porque a falha é do próprio Chromium.

      connect-src: Convex (dados) e LiveKit (sinalização de voz, F7).
      img-src https:: avatares vindos do Google e do WorkOS — e, desde o Plano
        08.5-14, também as IMAGENS ANEXADAS, que o Convex serve de
        `https://*.convex.cloud`. Já estavam cobertas por `https:`; conferido
        antes de mexer, em vez de afrouxar por precaução.
      media-src blob:: tracks de áudio e vídeo do WebRTC.
      media-src https://*.convex.cloud: ÁUDIO E VÍDEO ANEXADOS (CHAT-10, Plano
        08.5-14). Sem esta entrada, um `.mp3` ou `.mp4` anexado é recusado pelo
        Chromium sem gerar erro de aplicação nenhum — exatamente a classe de
        falha silenciosa que travou o app na Fase 2 e é o motivo deste
        comentário existir. `blob:` NÃO cobre isto: o arquivo anexado vem por
        URL do storage, não de um blob local.

      A mídia WebRTC em si (UDP/ICE) não passa por CSP — só a sinalização.
      Manter esta lista explícita em vez de afrouxar para `*`: o renderer
      exibe conteúdo de terceiros (avatares) e a CSP é a última barreira.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
